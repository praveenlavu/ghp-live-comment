name: ghp-live
# C-R2 live harness (PLAN-LIVE-0.1 round 2): runs the released ghp 0.1.1 (tag v0.1.1 = e440627) as github-actions[bot]. Fictional data only. Removed at the end of the run.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: issue number (digits)
        required: true
      steps:
        description: space-separated step names
        required: true
      arg:
        description: optional comment text for bot-approve (ASCII letters, digits, space, and / : > [ ] -)
        required: false
        default: ""
permissions:
  issues: write
  contents: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ghp steps
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ inputs.issue }}
          STEPS: ${{ inputs.steps }}
          ARG: ${{ inputs.arg }}
          REF: ${{ github.ref_name }}
        run: |
          set +e -u
          [[ "$N" =~ ^[0-9]{1,6}$ ]] || { echo "bad issue"; exit 2; }
          [[ "$STEPS" =~ ^[a-z0-9\ -]{1,400}$ ]] || { echo "bad steps"; exit 2; }
          re='^[][a-zA-Z0-9 /:>-]{0,200}$'; [[ "$ARG" =~ $re ]] || { echo "bad arg"; exit 2; }
          python3 -m venv "$RUNNER_TEMP/v" && export PATH="$RUNNER_TEMP/v/bin:$PATH"
          pip install -q "spec-kit-ghp @ git+https://github.com/praveenlavu/spec-kit-ghp.git@e440627644e6e5268ef3ce19ee4547f75799e03d"
          ghp --version
          gh repo clone "$GITHUB_REPOSITORY" w -- --branch "$REF" -q
          cd w
          gh auth setup-git
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "origin/HEAD -> $(git symbolic-ref refs/remotes/origin/HEAD)"; git log --oneline -1
          mkdir -p .ghp
          for s in $STEPS; do
            echo "::group::L step $s"
            case "$s" in
              probe) gh api graphql -f query='{viewer{login databaseId __typename}}' ;;
              qpost) ghp questions "$N" --post --apply ;;
              qsync) ghp questions "$N" --sync ;;
              dpost) ghp decisions "$N" --post --apply ;;
              dsync) ghp decisions "$N" --sync ;;
              dresolve) ghp decisions "$N" --resolve D1 --validated --by PO ;;
              push-preview) ghp push "$N" --plan-out .ghp/plan-push.md ;;
              push-apply) ghp push "$N" --apply --expect-plan .ghp/plan-push.md ;;
              pr-preview) ghp pr create "$N" --title "L-052 fictional change for #$N" --body-file pr-body.md --base main --head "$REF" --plan-out .ghp/plan-pr.md ;;
              pr-apply) ghp pr create "$N" --title "L-052 fictional change for #$N" --body-file pr-body.md --base main --head "$REF" --apply --expect-plan .ghp/plan-pr.md ;;
              activate) ghp activate "$N" --apply ;;
              done-preview) ghp done "$N" --plan-out .ghp/plan-done.md ;;
              done-apply) ghp done "$N" --apply --expect-plan .ghp/plan-done.md ;;
              sync-dry) ghp approvals sync x --dry-run ;;
              sync-crafted) mkdir -p .specify/workflows/runs/r1 && python3 -c 'import json,sys; json.dump({"workflow_id":"ghp-lifecycle","run_id":"r1","status":"paused","current_step_id":"approve-done","inputs":{"issue_number":int(sys.argv[1])},"updated_at":"2026-11-12T00:00:00+00:00"},open(".specify/workflows/runs/r1/state.json","w"))' "$N" && ghp approvals sync r1 --dry-run ;;
              bot-approve) printf '%s\n' "$ARG" | gh issue comment "$N" --body-file - ;;
              check-*) ghp approvals check "$N" --gate "${s#check-}" ;;
              notrust-check) (rm -rf ../nt && git clone -q --no-checkout "https://github.com/$GITHUB_REPOSITORY" ../nt && cd ../nt && git remote set-head origin -d; git checkout -q "$REF" && git symbolic-ref refs/remotes/origin/HEAD; ghp approvals check "$N" --gate review-spec) ;;
              projcfg) python3 -c 'import json; c=json.load(open("ghp.config.json")); c.update(project_owner="praveenlavu", project_number=3); json.dump(c,open("ghp.config.json","w"))' && cat ghp.config.json && echo && ghp project show; echo "L end project-show exit=$?"; ghp doctor --json ;;
              persist) git add -A -- dod specs && git commit -qm "C-R2 harness: persist the bot's ledger/tasks/decisions changes (fictional)" && git push -q origin "HEAD:$REF"; git log --oneline -1 ;;
              pr-body) cat pr-body.md ;;
              done-apply-nox) ghp done "$N" --apply ;;
              show) git status --short; git diff; for f in .ghp/approvals/*.json; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done ;;
              *) echo "unknown step $s"; false ;;
            esac
            rc=$?
            echo "::endgroup::"
            echo "L end $s exit=$rc"
          done
          true
